<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Print a range of font sizes with a JavaScript click handler.">
    <meta name="theme-color" content="#FAFAF8">
    <title>Text Sizes · Classes &amp; Events</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="topbar">
        <div class="topbar__inner">
            <a class="brand" href="figures.html" aria-label="Classes &amp; Events: home">
                <svg class="brand__mark" viewBox="0 0 28 28" aria-hidden="true">
                    <rect width="28" height="28" rx="8" fill="#4338CA"/>
                    <rect x="7" y="7" width="9" height="9" rx="2" fill="#FFFFFF" fill-opacity="0.92"/>
                    <circle cx="17.5" cy="17.5" r="4.75" fill="none" stroke="#FFFFFF" stroke-width="2"/>
                </svg>
                <span class="brand__label">Classes &amp; Events</span>
            </a>
            <nav aria-label="Pages">
                <ul class="nav">
                    <li><a href="figures.html">Figures</a></li>
                    <li><a href="sizes.html" aria-current="page">Sizes</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="page">
        <section class="hero" aria-labelledby="page-title">
            <p class="eyebrow">Part 3 · Event handlers</p>
            <h1 id="page-title" class="display">Text <em>Sizes</em></h1>
            <p class="lede">Pick a start and an end size, then print every size in between, one line each.</p>
        </section>

        <div class="layout layout--sizes">
            <section class="card card--controls" aria-labelledby="controls-title">
                <header class="card__header">
                    <h2 id="controls-title" class="card__title">Range</h2>
                </header>
                <div class="form">
                    <div class="field">
                        <label for="start-size">Start size</label>
                        <input type="number" id="start-size" min="1" max="98" step="1" value="5">
                    </div>
                    <div class="field">
                        <label for="end-size">End size</label>
                        <input type="number" id="end-size" min="2" max="99" step="1" value="20">
                    </div>
                    <p class="hint">Rule: <code>0 &lt; start &lt; end &lt; 100</code></p>
                    <button type="button" onclick="printText()">Print text</button>
                </div>
            </section>

            <section class="card" aria-labelledby="output-title">
                <header class="card__header">
                    <h2 id="output-title" class="card__title">Output</h2>
                    <span class="card__meta">Sizes in pt</span>
                </header>
                <div id="output" class="output" aria-live="polite"></div>
            </section>
        </div>
    </main>

    <footer class="footer">
        <div class="footer__inner">SoftUni · Fundamentals of Programming with AI · Radoslav Chakarov</div>
    </footer>

    <script>
        "use strict";

        function printText() {
            const start = Number(document.getElementById("start-size").value);
            const end = Number(document.getElementById("end-size").value);
            const output = document.getElementById("output");

            // Clear the previous output on every click.
            output.replaceChildren();

            // Empty input -> 0 and non-numeric -> NaN; both fail this check.
            if (!(0 < start && start < end && end < 100)) {
                const error = document.createElement("div");
                error.className = "error";
                error.textContent = "Invalid range";
                output.appendChild(error);
                return;
            }

            for (let size = start; size <= end; size++) {
                const line = document.createElement("div");
                line.style.fontSize = `${size}pt`;
                line.textContent = `Size ${size}`;
                output.appendChild(line);
            }
        }
    </script>
</body>
</html>
