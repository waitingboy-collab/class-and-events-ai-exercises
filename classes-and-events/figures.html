<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colorful Figures</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="nav">
        <a href="figures.html" aria-current="page">Figures</a>
        <a href="sizes.html">Sizes</a>
    </nav>

    <main class="card">
        <h1>Colorful Figures</h1>
        <p class="subtitle">
            Origin in the center, y axis pointing up, 1 unit = 5 px.
            (x, y) is the top-left corner of squares and rectangles and the center of circles.
        </p>

        <div class="canvas-wrap">
            <canvas id="scene" aria-label="Drawing of colorful figures"></canvas>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Figure</th>
                        <th class="num">Area</th>
                        <th class="num">Perimeter</th>
                    </tr>
                </thead>
                <tbody id="figures-table"></tbody>
            </table>
        </div>
    </main>

    <script src="figures.js"></script>
    <script>
        "use strict";

        const WIDTH = 600;   // logical canvas size in CSS pixels
        const HEIGHT = 400;
        const SCALE = 5;     // pixels per figure unit

        const figures = [
            new ColorfulSquare(10, 35, 10, new Color(255, 122, 30)),
            new ColorfulRectangle(-10, 20, 20, 15, new Color(127, 170, 232)),
            new ColorfulCircle(-35, -10, 15, new Color(0, 238, 0)),
            new ColorfulAnnulus(20, -10, 15, 5, new Color(238, 51, 51)),
            new ColorfulSquare(-50, 35, 12, new Color(142, 68, 173)),
            new ColorfulRectangle(40, 30, 15, 25, new Color(255, 193, 7)),
        ];

        // Figure coordinates (y up, origin in center) -> canvas pixels (y down).
        const toCanvasX = (x) => WIDTH / 2 + x * SCALE;
        const toCanvasY = (y) => HEIGHT / 2 - y * SCALE;

        function setupCanvas(canvas) {
            const ratio = window.devicePixelRatio || 1;
            canvas.width = WIDTH * ratio;
            canvas.height = HEIGHT * ratio;
            const ctx = canvas.getContext("2d");
            ctx.scale(ratio, ratio);
            return ctx;
        }

        function drawGrid(ctx) {
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, WIDTH, HEIGHT);

            ctx.lineWidth = 1;
            ctx.strokeStyle = "#eef0f4";
            for (let x = 0; x <= WIDTH; x += 10 * SCALE) {
                ctx.beginPath();
                ctx.moveTo(x + 0.5, 0);
                ctx.lineTo(x + 0.5, HEIGHT);
                ctx.stroke();
            }
            for (let y = 0; y <= HEIGHT; y += 10 * SCALE) {
                ctx.beginPath();
                ctx.moveTo(0, y + 0.5);
                ctx.lineTo(WIDTH, y + 0.5);
                ctx.stroke();
            }

            ctx.strokeStyle = "#c3c8d2";
            ctx.beginPath();
            ctx.moveTo(0, HEIGHT / 2 + 0.5);
            ctx.lineTo(WIDTH, HEIGHT / 2 + 0.5);
            ctx.moveTo(WIDTH / 2 + 0.5, 0);
            ctx.lineTo(WIDTH / 2 + 0.5, HEIGHT);
            ctx.stroke();

            ctx.fillStyle = "#9aa1ad";
            ctx.font = "12px system-ui, sans-serif";
            ctx.fillText("x", WIDTH - 14, HEIGHT / 2 - 6);
            ctx.fillText("y", WIDTH / 2 + 6, 14);
        }

        function drawFigure(ctx, figure) {
            const left = toCanvasX(figure.x);
            const top = toCanvasY(figure.y);

            ctx.beginPath();
            if (figure instanceof ColorfulSquare) {
                ctx.rect(left, top, figure.width * SCALE, figure.width * SCALE);
            } else if (figure instanceof ColorfulRectangle) {
                ctx.rect(left, top, figure.width * SCALE, figure.height * SCALE);
            } else if (figure instanceof ColorfulCircle) {
                ctx.arc(left, top, figure.radius * SCALE, 0, 2 * Math.PI);
            } else if (figure instanceof ColorfulAnnulus) {
                // Outer circle clockwise, inner circle counter-clockwise -> ring.
                ctx.arc(left, top, figure.outerRadius * SCALE, 0, 2 * Math.PI, false);
                ctx.moveTo(left + figure.innerRadius * SCALE, top);
                ctx.arc(left, top, figure.innerRadius * SCALE, 0, 2 * Math.PI, true);
            } else {
                return;
            }

            ctx.fillStyle = figure.color.toString();
            ctx.fill("evenodd");
            ctx.lineWidth = 1.5;
            ctx.strokeStyle = "rgba(0, 0, 0, 0.35)";
            ctx.stroke();
        }

        function fillTable(tbody) {
            for (const figure of figures) {
                const row = document.createElement("tr");

                const nameCell = document.createElement("td");
                const swatch = document.createElement("span");
                swatch.className = "swatch";
                swatch.style.background = figure.color.toString();
                const code = document.createElement("code");
                code.textContent = figure.toString();
                nameCell.append(swatch, code);

                const areaCell = document.createElement("td");
                areaCell.className = "num";
                areaCell.textContent = figure.area().toFixed(2);

                const perimeterCell = document.createElement("td");
                perimeterCell.className = "num";
                perimeterCell.textContent = figure.perimeter().toFixed(2);

                row.append(nameCell, areaCell, perimeterCell);
                tbody.appendChild(row);
            }
        }

        const ctx = setupCanvas(document.getElementById("scene"));
        drawGrid(ctx);
        figures.forEach((figure) => drawFigure(ctx, figure));
        fillTable(document.getElementById("figures-table"));
    </script>
</body>
</html>
